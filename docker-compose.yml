version: '3.8'

services:
  # MongoDB Operational Database
  mongo:
    image: mongo:7.0
    container_name: moil_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: moil_reserveiq
    volumes:
      - mongo_data:/data/db
    networks:
      - moil_net

  # Python ML Microservice
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: moil_ml_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - moil_net

  # Express REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moil_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/moil_reserveiq
      - JWT_SECRET=moil_reserveiq_production_secret_key_2026
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - mongo
      - ml-service
    networks:
      - moil_net

  # React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moil_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - moil_net

volumes:
  mongo_data:
    driver: local

networks:
  moil_net:
    driver: bridge
