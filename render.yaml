services:
  # Node.js + Express + MongoDB REST API Backend
  - type: web
    name: sih-moil
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        value: mongodb+srv://vaishayvinayak_db_user:SHFKDAjZFFItOnRU@cluster0.tmx2kxe.mongodb.net/moil_reserveiq?retryWrites=true&w=majority
      - key: JWT_SECRET
        value: moil_reserveiq_secret_super_secure_key_2026
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: vaishayvinayak@gmail.com
      - key: ADMIN_PASSWORD
        value: vinayak@2006
      - key: ML_SERVICE_URL
        value: https://sih-moil-1.onrender.com
      - key: CORS_ORIGIN
        value: "*"

  # Python + FastAPI + Scikit-learn AI/ML Microservice
  - type: web
    name: moil-reserveiq-ml
    env: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
